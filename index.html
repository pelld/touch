<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Touch</title>

  <style>
    /* ======================================================================
       00A — PAGE
       The whole page is the drawing surface. There is intentionally no UI.
       ====================================================================== */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* ======================================================================
       00B — TOUCH SURFACE
       ====================================================================== */
    #touchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <canvas id="touchCanvas" aria-label="Touch and hold to paint colour"></canvas>

  <script>
    'use strict';

    /* ======================================================================
       01A — SETTINGS
       Four seconds of LOCAL contact takes a surface area from white to black.
       Contact width/height come from the device rather than a fixed brush.
       ====================================================================== */
    const HOLD_DURATION_MS = 4000;
    const MAX_DPR = 3;

    const MOUSE_RADIUS_CSS_PX = 2;
    const FALLBACK_TOUCH_RADIUS_CSS_PX = 3.5;
    const MIN_TOUCH_HALF_SIZE_CSS_PX = 0.9;
    const MAX_TOUCH_HALF_SIZE_CSS_PX = 35;
    const SOLID_CORE = 0.97;

    /* ======================================================================
       02A — CANVAS AND LOCAL DWELL-TIME MAP
       Each backing pixel stores its own accumulated contact time.
       ====================================================================== */
    const canvas = document.getElementById('touchCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let dpr = 1;
    let dwellMs = new Float32Array(0);
    let pixelBuffer = null;

    /* ======================================================================
       03A — COLOUR JOURNEY
       white → yellow → orange → red → magenta → purple → blue → cyan → green
       → deep green → black.
       ====================================================================== */
    const COLOUR_STOPS = [
      [0.00, 255, 255, 255],
      [0.08, 255, 248, 176],
      [0.16, 255, 214,  64],
      [0.25, 255, 132,  34],
      [0.34, 242,  48,  48],
      [0.43, 230,  48, 145],
      [0.52, 159,  61, 217],
      [0.61,  68,  78, 226],
      [0.70,  32, 178, 218],
      [0.79,  42, 201, 135],
      [0.87,  17, 116,  72],
      [0.94,  10,  48,  32],
      [1.00,   0,   0,   0]
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function colourAt(progress) {
      const p = clamp(progress, 0, 1);

      for (let i = 0; i < COLOUR_STOPS.length - 1; i += 1) {
        const a = COLOUR_STOPS[i];
        const b = COLOUR_STOPS[i + 1];

        if (p <= b[0]) {
          const span = b[0] - a[0];
          const raw = span === 0 ? 0 : (p - a[0]) / span;
          const mix = smoothstep(clamp(raw, 0, 1));

          return {
            r: Math.round(lerp(a[1], b[1], mix)),
            g: Math.round(lerp(a[2], b[2], mix)),
            b: Math.round(lerp(a[3], b[3], mix))
          };
        }
      }

      return { r: 0, g: 0, b: 0 };
    }

    /* ======================================================================
       03B — PRECOMPUTED COLOUR LOOKUP
       ====================================================================== */
    const LUT_STEPS = 1024;
    const colourLut = new Uint8ClampedArray((LUT_STEPS + 1) * 3);

    for (let step = 0; step <= LUT_STEPS; step += 1) {
      const colour = colourAt(step / LUT_STEPS);
      const offset = step * 3;
      colourLut[offset] = colour.r;
      colourLut[offset + 1] = colour.g;
      colourLut[offset + 2] = colour.b;
    }

    /* ======================================================================
       04A — PIXEL BUFFER
       ====================================================================== */
    function writePixel(pixelIndex) {
      const progress = Math.min(1, dwellMs[pixelIndex] / HOLD_DURATION_MS);
      const lutIndex = Math.round(progress * LUT_STEPS) * 3;
      const offset = pixelIndex * 4;

      pixelBuffer.data[offset] = colourLut[lutIndex];
      pixelBuffer.data[offset + 1] = colourLut[lutIndex + 1];
      pixelBuffer.data[offset + 2] = colourLut[lutIndex + 2];
      pixelBuffer.data[offset + 3] = 255;
    }

    function rebuildPixelBuffer() {
      pixelBuffer = ctx.createImageData(canvas.width, canvas.height);

      for (let i = 0; i < dwellMs.length; i += 1) {
        writePixel(i);
      }

      ctx.putImageData(pixelBuffer, 0, 0);
    }

    /* ======================================================================
       04B — RESIZE WITHOUT LOSING TOUCH HISTORY
       ====================================================================== */
    function resizeCanvas() {
      const oldWidth = canvas.width;
      const oldHeight = canvas.height;
      const oldDwell = dwellMs;

      dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
      const newWidth = Math.max(1, Math.round(window.innerWidth * dpr));
      const newHeight = Math.max(1, Math.round(window.innerHeight * dpr));

      canvas.width = newWidth;
      canvas.height = newHeight;
      dwellMs = new Float32Array(newWidth * newHeight);

      if (oldWidth > 0 && oldHeight > 0 && oldDwell.length) {
        for (let y = 0; y < newHeight; y += 1) {
          const oldY = Math.min(oldHeight - 1, Math.floor(y * oldHeight / newHeight));
          const newRow = y * newWidth;
          const oldRow = oldY * oldWidth;

          for (let x = 0; x < newWidth; x += 1) {
            const oldX = Math.min(oldWidth - 1, Math.floor(x * oldWidth / newWidth));
            dwellMs[newRow + x] = oldDwell[oldRow + oldX];
          }
        }
      }

      rebuildPixelBuffer();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas, { passive: true });

    /* ======================================================================
       05A — POINTER POSITION
       ====================================================================== */
    const activePointers = new Map();

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * dpr,
        y: (event.clientY - rect.top) * dpr
      };
    }

    /* ======================================================================
       05B — REAL CONTACT FOOTPRINT
       PointerEvent.width/height describe the browser's estimate of the touch
       contact geometry in CSS pixels. We use that geometry at essentially 1:1
       scale: a narrow contact stays narrow; a broad finger pad stays broad.

       Some devices expose no useful width/height. Only in that case do we use
       a small pressure-sensitive fallback.
       ====================================================================== */
    function footprintFromEvent(event) {
      if (event.pointerType === 'mouse') {
        const radius = MOUSE_RADIUS_CSS_PX * dpr;
        return { rx: radius, ry: radius };
      }

      const width = Number.isFinite(event.width) ? event.width : 0;
      const height = Number.isFinite(event.height) ? event.height : 0;
      const hasGeometry = width > 1 || height > 1;

      let rxCss;
      let ryCss;

      if (hasGeometry) {
        rxCss = clamp(width * 0.5, MIN_TOUCH_HALF_SIZE_CSS_PX, MAX_TOUCH_HALF_SIZE_CSS_PX);
        ryCss = clamp(height * 0.5, MIN_TOUCH_HALF_SIZE_CSS_PX, MAX_TOUCH_HALF_SIZE_CSS_PX);
      } else {
        const pressure = event.pressure > 0 ? event.pressure : 0.5;
        const fallback = FALLBACK_TOUCH_RADIUS_CSS_PX * (0.65 + pressure * 0.7);
        rxCss = clamp(fallback, MIN_TOUCH_HALF_SIZE_CSS_PX, MAX_TOUCH_HALF_SIZE_CSS_PX);
        ryCss = rxCss;
      }

      return { rx: rxCss * dpr, ry: ryCss * dpr };
    }

    /* ======================================================================
       06A — ADD LOCAL TIME TO THE CONTACT FOOTPRINT
       The browser gives width/height, not a full skin outline, so the closest
       web representation is an ellipse. Only the final 3% is feathered.
       ====================================================================== */
    function addDwellAt(cx, cy, rx, ry, elapsedMs) {
      const safeRx = Math.max(rx, 0.5);
      const safeRy = Math.max(ry, 0.5);
      const minX = Math.max(0, Math.floor(cx - safeRx));
      const maxX = Math.min(canvas.width - 1, Math.ceil(cx + safeRx));
      const minY = Math.max(0, Math.floor(cy - safeRy));
      const maxY = Math.min(canvas.height - 1, Math.ceil(cy + safeRy));

      for (let y = minY; y <= maxY; y += 1) {
        const row = y * canvas.width;
        const ny = (y + 0.5 - cy) / safeRy;

        for (let x = minX; x <= maxX; x += 1) {
          const nx = (x + 0.5 - cx) / safeRx;
          const distanceSquared = nx * nx + ny * ny;
          if (distanceSquared >= 1) continue;

          const distance = Math.sqrt(distanceSquared);
          let weight = 1;

          if (distance > SOLID_CORE) {
            const edge = (1 - distance) / (1 - SOLID_CORE);
            weight = smoothstep(clamp(edge, 0, 1));
          }

          const pixelIndex = row + x;
          const next = Math.min(HOLD_DURATION_MS, dwellMs[pixelIndex] + elapsedMs * weight);

          if (next !== dwellMs[pixelIndex]) {
            dwellMs[pixelIndex] = next;
            writePixel(pixelIndex);
          }
        }
      }

      return { minX, minY, maxX, maxY };
    }

    /* ======================================================================
       06B — MOVE THE ACTUAL FOOTPRINT THROUGH SPACE
       Both position AND contact width/height are interpolated. Thus rolling
       from a nail/edge onto a finger pad can widen the mark during one gesture.
       ====================================================================== */
    function addDwellAlongPath(fromX, fromY, fromRx, fromRy, toX, toY, toRx, toRy, elapsedMs) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const distance = Math.hypot(dx, dy);
      const smallestRadius = Math.max(0.75, Math.min(fromRx, fromRy, toRx, toRy));
      const spacing = Math.max(0.75, smallestRadius * 0.4);
      const steps = Math.max(1, Math.ceil(distance / spacing));
      const timePerStep = elapsedMs / steps;
      let dirty = null;

      for (let step = 0; step < steps; step += 1) {
        const mix = (step + 0.5) / steps;
        const rect = addDwellAt(
          lerp(fromX, toX, mix),
          lerp(fromY, toY, mix),
          lerp(fromRx, toRx, mix),
          lerp(fromRy, toRy, mix),
          timePerStep
        );

        if (!dirty) {
          dirty = rect;
        } else {
          dirty.minX = Math.min(dirty.minX, rect.minX);
          dirty.minY = Math.min(dirty.minY, rect.minY);
          dirty.maxX = Math.max(dirty.maxX, rect.maxX);
          dirty.maxY = Math.max(dirty.maxY, rect.maxY);
        }
      }

      return dirty;
    }

    function flushDirtyRect(rect) {
      if (!rect) return;
      ctx.putImageData(
        pixelBuffer,
        0,
        0,
        rect.minX,
        rect.minY,
        rect.maxX - rect.minX + 1,
        rect.maxY - rect.minY + 1
      );
    }

    /* ======================================================================
       07A — UPDATE A POINTER FROM THE FINEST AVAILABLE SAMPLE
       getCoalescedEvents() can expose extra samples between normal browser
       events. We use the latest one to improve position/contact geometry.
       ====================================================================== */
    function updatePointerFromEvent(event) {
      const pointer = activePointers.get(event.pointerId);
      if (!pointer) return;

      let sample = event;
      if (typeof event.getCoalescedEvents === 'function') {
        const coalesced = event.getCoalescedEvents();
        if (coalesced.length) sample = coalesced[coalesced.length - 1];
      }

      const point = canvasPoint(sample);
      const footprint = footprintFromEvent(sample);
      pointer.x = point.x;
      pointer.y = point.y;
      pointer.rx = footprint.rx;
      pointer.ry = footprint.ry;
    }

    /* ======================================================================
       07B — POINTER EVENTS
       ====================================================================== */
    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);

      const point = canvasPoint(event);
      const footprint = footprintFromEvent(event);
      const now = performance.now();

      activePointers.set(event.pointerId, {
        x: point.x,
        y: point.y,
        rx: footprint.rx,
        ry: footprint.ry,
        lastX: point.x,
        lastY: point.y,
        lastRx: footprint.rx,
        lastRy: footprint.ry,
        lastTick: now
      });
    });

    canvas.addEventListener('pointermove', (event) => {
      event.preventDefault();
      updatePointerFromEvent(event);
    });

    // Chrome/Android may provide higher-frequency raw pointer updates.
    canvas.addEventListener('pointerrawupdate', updatePointerFromEvent);

    function finishPointer(event) {
      const pointer = activePointers.get(event.pointerId);
      if (!pointer) return;

      const now = performance.now();
      const elapsedMs = Math.max(0, Math.min(50, now - pointer.lastTick));
      const dirty = addDwellAlongPath(
        pointer.lastX, pointer.lastY, pointer.lastRx, pointer.lastRy,
        pointer.x, pointer.y, pointer.rx, pointer.ry,
        elapsedMs
      );
      flushDirtyRect(dirty);
      activePointers.delete(event.pointerId);
    }

    canvas.addEventListener('pointerup', finishPointer);
    canvas.addEventListener('pointercancel', finishPointer);
    canvas.addEventListener('lostpointercapture', finishPointer);

    /* ======================================================================
       08A — ANIMATION LOOP
       A stationary contact continues accumulating time. A moving contact
       spreads only the elapsed milliseconds across the actual area traversed.
       ====================================================================== */
    function animate(now) {
      for (const pointer of activePointers.values()) {
        const elapsedMs = Math.max(0, Math.min(50, now - pointer.lastTick));

        if (elapsedMs > 0) {
          const dirty = addDwellAlongPath(
            pointer.lastX, pointer.lastY, pointer.lastRx, pointer.lastRy,
            pointer.x, pointer.y, pointer.rx, pointer.ry,
            elapsedMs
          );
          flushDirtyRect(dirty);

          pointer.lastX = pointer.x;
          pointer.lastY = pointer.y;
          pointer.lastRx = pointer.rx;
          pointer.lastRy = pointer.ry;
          pointer.lastTick = now;
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    /* ======================================================================
       09A — BROWSER GESTURE GUARDS
       ====================================================================== */
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('dragstart', (event) => event.preventDefault());
  </script>
</body>
</html>
