<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Touch</title>

  <style>
    /* ======================================================================
       00A — PAGE
       The whole page is the drawing surface. There is intentionally no UI.
       ====================================================================== */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* ======================================================================
       00B — CANVAS
       Browser gestures are disabled so touch belongs entirely to the artwork.
       ====================================================================== */
    #touchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #ffffff;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="touchCanvas" aria-label="Touch and hold to paint colour"></canvas>

  <script>
    'use strict';

    /* ======================================================================
       01A — SETTINGS
       Colour belongs to each area of the surface. 1.5 seconds of accumulated
       local contact moves that area from white through the spectrum to black.
       ====================================================================== */
    const HOLD_DURATION_MS = 1500;
    const TOUCH_RADIUS_CSS_PX = 8;
    const MOUSE_RADIUS_CSS_PX = 5;
    const SOLID_CORE = 0.82;
    const MAX_DPR = 3;

    /* ======================================================================
       02A — CANVAS AND LOCAL DWELL MAP
       Every backing-canvas pixel stores its own accumulated touch duration.
       ====================================================================== */
    const canvas = document.getElementById('touchCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let dpr = 1;
    let dwellMs = new Float32Array(0);
    let pixelBuffer = null;

    /* ======================================================================
       03A — COLOUR JOURNEY
       ====================================================================== */
    const COLOUR_STOPS = [
      [0.00, 255, 255, 255],
      [0.08, 255, 248, 176],
      [0.16, 255, 214,  64],
      [0.25, 255, 132,  34],
      [0.34, 242,  48,  48],
      [0.43, 230,  48, 145],
      [0.52, 159,  61, 217],
      [0.61,  68,  78, 226],
      [0.70,  32, 178, 218],
      [0.79,  42, 201, 135],
      [0.87,  17, 116,  72],
      [0.94,  10,  48,  32],
      [1.00,   0,   0,   0]
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function colourAt(progress) {
      const p = clamp(progress, 0, 1);

      for (let i = 0; i < COLOUR_STOPS.length - 1; i += 1) {
        const a = COLOUR_STOPS[i];
        const b = COLOUR_STOPS[i + 1];

        if (p <= b[0]) {
          const span = b[0] - a[0];
          const rawMix = span === 0 ? 0 : (p - a[0]) / span;
          const mix = smoothstep(clamp(rawMix, 0, 1));

          return {
            r: Math.round(a[1] + (b[1] - a[1]) * mix),
            g: Math.round(a[2] + (b[2] - a[2]) * mix),
            b: Math.round(a[3] + (b[3] - a[3]) * mix)
          };
        }
      }

      return { r: 0, g: 0, b: 0 };
    }

    /* ======================================================================
       03B — PRECOMPUTED COLOUR LOOKUP
       ====================================================================== */
    const LUT_STEPS = 1024;
    const colourLut = new Uint8ClampedArray((LUT_STEPS + 1) * 3);

    for (let step = 0; step <= LUT_STEPS; step += 1) {
      const colour = colourAt(step / LUT_STEPS);
      const offset = step * 3;
      colourLut[offset] = colour.r;
      colourLut[offset + 1] = colour.g;
      colourLut[offset + 2] = colour.b;
    }

    /* ======================================================================
       04A — PIXEL BUFFER
       ====================================================================== */
    function writePixel(pixelIndex) {
      const progress = Math.min(1, dwellMs[pixelIndex] / HOLD_DURATION_MS);
      const lutIndex = Math.round(progress * LUT_STEPS) * 3;
      const offset = pixelIndex * 4;

      pixelBuffer.data[offset] = colourLut[lutIndex];
      pixelBuffer.data[offset + 1] = colourLut[lutIndex + 1];
      pixelBuffer.data[offset + 2] = colourLut[lutIndex + 2];
      pixelBuffer.data[offset + 3] = 255;
    }

    function rebuildPixelBuffer() {
      pixelBuffer = ctx.createImageData(canvas.width, canvas.height);

      for (let i = 0; i < dwellMs.length; i += 1) {
        writePixel(i);
      }

      ctx.putImageData(pixelBuffer, 0, 0);
    }

    /* ======================================================================
       04B — RESIZE WHILE PRESERVING THE ARTWORK
       ====================================================================== */
    function resizeCanvas() {
      const oldWidth = canvas.width;
      const oldHeight = canvas.height;
      const oldDwell = dwellMs;

      dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
      const newWidth = Math.max(1, Math.round(window.innerWidth * dpr));
      const newHeight = Math.max(1, Math.round(window.innerHeight * dpr));

      canvas.width = newWidth;
      canvas.height = newHeight;
      dwellMs = new Float32Array(newWidth * newHeight);

      if (oldWidth > 0 && oldHeight > 0 && oldDwell.length) {
        for (let y = 0; y < newHeight; y += 1) {
          const oldY = Math.min(oldHeight - 1, Math.floor(y * oldHeight / newHeight));
          const newRow = y * newWidth;
          const oldRow = oldY * oldWidth;

          for (let x = 0; x < newWidth; x += 1) {
            const oldX = Math.min(oldWidth - 1, Math.floor(x * oldWidth / newWidth));
            dwellMs[newRow + x] = oldDwell[oldRow + oldX];
          }
        }
      }

      rebuildPixelBuffer();
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas, { passive: true });

    /* ======================================================================
       05A — POINTER HELPERS
       The mark size is now intentionally uniform. Device-reported contact
       geometry and pressure are ignored because they proved too noisy.
       ====================================================================== */
    const activePointers = new Map();

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * dpr,
        y: (event.clientY - rect.top) * dpr
      };
    }

    function radiusFor(event) {
      const cssRadius = event.pointerType === 'mouse' ? MOUSE_RADIUS_CSS_PX : TOUCH_RADIUS_CSS_PX;
      return cssRadius * dpr;
    }

    /* ======================================================================
       06A — ADD LOCAL TIME TO ONE UNIFORM POINT
       A mostly solid circular point has only a narrow soft edge. This keeps the
       result clean and predictable while still avoiding jagged pixel edges.
       ====================================================================== */
    function addDwellAt(cx, cy, radius, elapsedMs) {
      const minX = Math.max(0, Math.floor(cx - radius));
      const maxX = Math.min(canvas.width - 1, Math.ceil(cx + radius));
      const minY = Math.max(0, Math.floor(cy - radius));
      const maxY = Math.min(canvas.height - 1, Math.ceil(cy + radius));

      for (let y = minY; y <= maxY; y += 1) {
        const row = y * canvas.width;
        const ny = (y + 0.5 - cy) / radius;

        for (let x = minX; x <= maxX; x += 1) {
          const nx = (x + 0.5 - cx) / radius;
          const distanceSquared = nx * nx + ny * ny;
          if (distanceSquared >= 1) continue;

          const distance = Math.sqrt(distanceSquared);
          let weight = 1;

          if (distance > SOLID_CORE) {
            const edge = (1 - distance) / (1 - SOLID_CORE);
            weight = smoothstep(clamp(edge, 0, 1));
          }

          const pixelIndex = row + x;
          const next = Math.min(HOLD_DURATION_MS, dwellMs[pixelIndex] + elapsedMs * weight);

          if (next !== dwellMs[pixelIndex]) {
            dwellMs[pixelIndex] = next;
            writePixel(pixelIndex);
          }
        }
      }

      return { minX, minY, maxX, maxY };
    }

    /* ======================================================================
       06B — SPREAD ELAPSED TIME ALONG MOVEMENT
       Time is divided among the positions crossed in that interval. A long
       gesture therefore does not make newly visited areas jump towards black.
       ====================================================================== */
    function addDwellAlongPath(fromX, fromY, toX, toY, radius, elapsedMs) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const distance = Math.hypot(dx, dy);
      const spacing = Math.max(1, radius * 0.32);
      const steps = Math.max(1, Math.ceil(distance / spacing));
      const timePerStep = elapsedMs / steps;
      let dirty = null;

      for (let step = 0; step < steps; step += 1) {
        const mix = (step + 0.5) / steps;
        const rect = addDwellAt(
          fromX + dx * mix,
          fromY + dy * mix,
          radius,
          timePerStep
        );

        if (!dirty) {
          dirty = rect;
        } else {
          dirty.minX = Math.min(dirty.minX, rect.minX);
          dirty.minY = Math.min(dirty.minY, rect.minY);
          dirty.maxX = Math.max(dirty.maxX, rect.maxX);
          dirty.maxY = Math.max(dirty.maxY, rect.maxY);
        }
      }

      return dirty;
    }

    function flushDirtyRect(rect) {
      if (!rect) return;
      const width = rect.maxX - rect.minX + 1;
      const height = rect.maxY - rect.minY + 1;
      ctx.putImageData(pixelBuffer, 0, 0, rect.minX, rect.minY, width, height);
    }

    /* ======================================================================
       07A — PROCESS ONE POINTER SAMPLE
       Coalesced samples are used when available purely for smoother movement;
       they no longer alter the size of the mark.
       ====================================================================== */
    function processSample(pointer, event, now) {
      const point = canvasPoint(event);
      const elapsedMs = Math.max(0, Math.min(50, now - pointer.lastTick));

      if (elapsedMs > 0) {
        const dirty = addDwellAlongPath(pointer.lastX, pointer.lastY, point.x, point.y, pointer.radius, elapsedMs);
        flushDirtyRect(dirty);
      }

      pointer.x = point.x;
      pointer.y = point.y;
      pointer.lastX = point.x;
      pointer.lastY = point.y;
      pointer.lastTick = now;
    }

    /* ======================================================================
       07B — POINTER EVENTS
       ====================================================================== */
    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);

      const point = canvasPoint(event);
      const now = performance.now();

      activePointers.set(event.pointerId, {
        x: point.x,
        y: point.y,
        lastX: point.x,
        lastY: point.y,
        radius: radiusFor(event),
        lastTick: now
      });
    });

    canvas.addEventListener('pointermove', (event) => {
      const pointer = activePointers.get(event.pointerId);
      if (!pointer) return;
      event.preventDefault();

      const samples = typeof event.getCoalescedEvents === 'function' ? event.getCoalescedEvents() : [];
      const events = samples.length ? samples : [event];
      const frameNow = performance.now();

      for (let i = 0; i < events.length; i += 1) {
        const sampleNow = i === events.length - 1 ? frameNow : pointer.lastTick + (frameNow - pointer.lastTick) / (events.length - i);
        processSample(pointer, events[i], sampleNow);
      }
    });

    function finishPointer(event) {
      const pointer = activePointers.get(event.pointerId);
      if (!pointer) return;

      const now = performance.now();
      const point = canvasPoint(event);
      const elapsedMs = Math.max(0, now - pointer.lastTick);
      const dirty = addDwellAlongPath(pointer.lastX, pointer.lastY, point.x, point.y, pointer.radius, elapsedMs);
      flushDirtyRect(dirty);

      activePointers.delete(event.pointerId);
    }

    canvas.addEventListener('pointerup', finishPointer);
    canvas.addEventListener('pointercancel', finishPointer);
    canvas.addEventListener('lostpointercapture', finishPointer);

    /* ======================================================================
       08A — STATIONARY-HOLD ANIMATION
       A finger that does not move still adds time to the same local point.
       ====================================================================== */
    function animate(now) {
      for (const pointer of activePointers.values()) {
        const elapsedMs = Math.max(0, Math.min(50, now - pointer.lastTick));

        if (elapsedMs > 0) {
          const dirty = addDwellAt(pointer.x, pointer.y, pointer.radius, elapsedMs);
          flushDirtyRect(dirty);
          pointer.lastX = pointer.x;
          pointer.lastY = pointer.y;
          pointer.lastTick = now;
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    /* ======================================================================
       09A — BROWSER GESTURE GUARDS
       ====================================================================== */
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('dragstart', (event) => event.preventDefault());
  </script>
</body>
</html>
